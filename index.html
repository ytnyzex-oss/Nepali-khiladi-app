<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेपाली खेलाडी</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 400px;
            border: 1px solid #ff9800;
        }
        button {
            background-color: #ff9800;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>नेपाली खेलाडीमा स्वागत छ!</h1>
    <p>तपाईंको गेमिङ र स्क्रिम टुर्नामेन्टको आधिकारिक प्लेटफर्म</p>

    <div class="card">
        <h2>आजको फ्री फायर स्क्रिम</h2>
        <p>समय: बेलुका ८:०० बजे</p>
        <p>प्रवेश शुल्क: रु. २०</p>
        <button onclick="alert('दर्ताको लागि छिट्टै खुल्नेछ!')">अहिले दर्ता गर्नुहोस्</button>
    </div>

</body>
</html>
